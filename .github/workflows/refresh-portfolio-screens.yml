name: Refresh portfolio screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-portfolio-screens.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Capture current live pages
        env:
          SITE_BASE: https://outside-inmates.slduthie.workers.dev
        run: |
          rm -rf portfolio-screens
          mkdir -p portfolio-screens
          node <<'NODE'
          const { chromium } = require('playwright');
          const pages = [
            ['home', '/'],
            ['start-here', '/start'],
            ['resources', '/resources'],
            ['families', '/families'],
            ['reentry', '/reentry']
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1, colorScheme: 'light' });
            for (const [name, route] of pages) {
              const page = await context.newPage();
              await page.goto(`${process.env.SITE_BASE}${route}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(3500);
              await page.screenshot({ path: `portfolio-screens/outside-inmates-${name}.png`, fullPage: true });
              await page.close();
            }
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          for file in portfolio-screens/*.png; do
            cwebp -quiet -q 72 -resize 1000 0 "$file" -o "${file%.png}.webp"
          done
          rm portfolio-screens/*.png
      - name: Save refreshed screenshots and remove temporary workflow
        run: |
          rm .github/workflows/refresh-portfolio-screens.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add portfolio-screens .github/workflows/refresh-portfolio-screens.yml
          git commit -m "Refresh Outside Inmates portfolio screenshots after card fixes"
          git push origin HEAD:main
