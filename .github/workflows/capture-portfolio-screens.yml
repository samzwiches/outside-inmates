name: Capture portfolio screens

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture real deployed pages
        env:
          SITE_BASE: https://outside-inmates.slduthie.workers.dev
        run: |
          mkdir -p portfolio-screens
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const pages = [
            ['home', '/'],
            ['start-here', '/start'],
            ['resources', '/resources'],
            ['families', '/families'],
            ['reentry', '/reentry']
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              colorScheme: 'light'
            });

            for (const [name, route] of pages) {
              const page = await context.newPage();
              const url = `${process.env.SITE_BASE}${route}`;
              console.log(`Capturing ${url}`);
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(3500);
              await page.evaluate(() => {
                document.querySelectorAll('[data-coming-soon], .coming-soon, [aria-label="Coming soon"]').forEach((node) => node.remove());
              });
              await page.screenshot({ path: `portfolio-screens/outside-inmates-${name}.png`, fullPage: true });
              fs.writeFileSync(`portfolio-screens/outside-inmates-${name}.url.txt`, page.url());
              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: outside-inmates-portfolio-screens
          path: portfolio-screens/*.png
          if-no-files-found: error
          retention-days: 7
